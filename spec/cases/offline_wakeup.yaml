case_id: CASE_OFFLINE_WAKEUP_001
name: 离线唤醒词识别
mode: offline
description: 仅验证唤醒词链路，要求三路日志均能拿到唤醒与播报证据。
playback:
  sequence:
    - type: tts
      text: 小美小美
observe_after_ms: 12000
expected:
  - id: com12_wake
    port: COM12
    match_type: contains
    pattern: "WAKE("
    required: true
  - id: com14_wakeup_callback
    port: COM14
    match_type: contains
    pattern: "wakeup_callback, keyword: xiao mei xiao mei"
    required: true
  - id: com13_offline_wakeup
    port: COM13
    match_type: contains
    pattern: "offline_wakeup"
    required: true
  - id: com13_player_playing
    port: COM13
    match_type: contains
    pattern: "local player status 2 PLAYING"
    required: true
  - id: com13_player_done
    port: COM13
    match_type: contains
    pattern: "local player status 6 PLAYBACK_COMPLETE"
    required: true
