case_id: CASE_OFFLINE_WAKEUP_OPEN_AC_001
name: 离线唤醒加打开空调
mode: offline
description: 验证小美小美唤醒后，离线命令词“打开空调”可以识别，并触发后续本地播报链路。
playback:
  sequence:
    - type: tts
      text: 小美小美
    - type: silence
      duration_ms: 1500
    - type: tts
      text: 打开空调
observe_after_ms: 12000
expected:
  - id: com12_wake
    port: COM12
    match_type: contains
    pattern: "WAKE("
    required: true
  - id: com12_command_keyword
    port: COM12
    match_type: regex
    pattern: "KEY=1\\(kong tiao kai ji\\)"
    required: true
  - id: com14_wakeup_callback
    port: COM14
    match_type: contains
    pattern: "wakeup_callback, keyword: xiao mei xiao mei"
    required: true
  - id: com14_offline_asr
    port: COM14
    match_type: contains
    pattern: "offline_asr_callbak, keyword: kong tiao kai ji"
    required: true
  - id: com13_offline_wakeup
    port: COM13
    match_type: contains
    pattern: "offline_wakeup"
    required: true
  - id: com13_offline_asr
    port: COM13
    match_type: contains
    pattern: "offline_asr_callbak, keyword: kong tiao kai ji"
    required: true
  - id: com14_tone_open_power
    port: COM14
    match_type: contains
    pattern: "play next tone 3:"
    required: true
  - id: com13_player_done
    port: COM13
    match_type: contains
    pattern: "local player status 6 PLAYBACK_COMPLETE"
    required: true
